name: Build APK & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Test, Analyze & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Step 1 - Run Unit & Widget Tests
        run: flutter test --timeout 60s

      - name: Step 1b - Run Comprehensive Phase Verifications
        run: dart test/verify_all_phases.dart

      - name: Step 2 - Run Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Eliminate Termux configs and sanitize Android build environment
        run: |
          # 1. Ensure gradlew uses bash interpreter and standard syntax
          sed -i '1s|.*|#!/usr/bin/env bash|' android/gradlew
          sed -i 's|^function splitJvmOpts|splitJvmOpts|' android/gradlew
          chmod +x android/gradlew

          # 2. Strip any Termux paths or overrides from gradle.properties if present
          if [ -f "android/gradle.properties" ]; then
            sed -i '/com\.termux/d' android/gradle.properties
            sed -i '/aapt2FromMavenOverride/d' android/gradle.properties
          fi

          # 3. Clean any potential residual local.properties or Termux paths
          rm -f android/local.properties

      - name: Step 3 - Build Debug APK
        run: flutter build apk --debug

      - name: Step 4 - Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byteflow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byteflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
